<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sign Up Page</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
<div class="container">
  <div class="card shadow signup-card">
    <div class="card-body">
      <h1 class="text-center mb-4">Sign Up Form</h1>

      <form id="signupForm" action="welcome.html">
        <div class="row mb-3">
          <div class="col">
            <label for="fName" class="form-label">First Name:</label>
            <input type="text" id="fName" name="fName" class="form-control">
          </div>
          <div class="col">
            <label for="lName" class="form-label">Last Name:</label>
            <input type="text" id="lName" name="lName" class="form-control">
          </div>
        </div>

        <div class="mb-3">
          <span class="form-label d-block">Gender:</span>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="gender" id="genderM" value="m">
            <label class="form-check-label" for="genderM">Male</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="gender" id="genderF" value="f">
            <label class="form-check-label" for="genderF">Female</label>
          </div>
        </div>

        <div class="mb-3">
          <label for="zip" class="form-label">Zip Code:</label>
          <div class="d-flex align-items-center gap-2">
            <input type="text" id="zip" name="zip" class="form-control short-input">
            <span id="zipError" class="msg"></span>
          </div>
        </div>

        <div class="geo-info mb-3">
          <div>City: <span id="city"></span></div>
          <div>Latitude: <span id="latitude"></span></div>
          <div>Longitude: <span id="longitude"></span></div>
        </div>

        <div class="row mb-3">
          <div class="col">
            <label for="state" class="form-label">State:</label>
            <select id="state" name="state" class="form-select">
              <option value="">Loading states...</option>
            </select>
          </div>
          <div class="col">
            <label for="county" class="form-label">Select a County:</label>
            <select id="county" name="county" class="form-select"></select>
          </div>
        </div>

        <div class="mb-3">
          <label for="username" class="form-label">Desired Username:</label>
          <div class="d-flex align-items-center gap-2">
            <input type="text" id="username" name="username" class="form-control short-input">
            <span id="usernameError" class="msg"></span>
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password:</label>
          <div class="d-flex align-items-center gap-2">
            <input type="password" id="password" name="password" class="form-control short-input">
            <span id="suggestedPwd" class="msg"></span>
          </div>
        </div>

        <div class="mb-3">
          <label for="passwordAgain" class="form-label">Type Password Again:</label>
          <input type="password" id="passwordAgain" name="passwordAgain" class="form-control short-input">
          <span id="passwordError" class="msg"></span>
        </div>

        <button class="btn btn-primary w-100">Sign up!</button>
      </form>
    </div>
  </div>
</div>
<script src="js/script.js"></script>
</body>
</html>
