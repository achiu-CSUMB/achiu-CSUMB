<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 180" width="560" height="180" font-family="Arial, sans-serif">
<title>Linear regression workflow from data to prediction</title>
<rect width="560" height="180" fill="#0B1A2E"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FFA500"/></marker></defs>
<rect x="12" y="60" width="96" height="60" rx="8" fill="#173F73" stroke="#00FF00"/>
<text x="60.0" y="95" fill="#FFFFFF" font-size="13" text-anchor="middle">Collect data</text>
<line x1="108" y1="90" x2="122" y2="90" stroke="#FFA500" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="123" y="60" width="96" height="60" rx="8" fill="#173F73" stroke="#00FF00"/>
<text x="171.0" y="86" fill="#FFFFFF" font-size="13" text-anchor="middle">Split</text>
<text x="171.0" y="104" fill="#FFFFFF" font-size="13" text-anchor="middle">train/test</text>
<line x1="219" y1="90" x2="233" y2="90" stroke="#FFA500" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="234" y="60" width="96" height="60" rx="8" fill="#173F73" stroke="#00FF00"/>
<text x="282.0" y="95" fill="#FFFFFF" font-size="13" text-anchor="middle">Fit model</text>
<line x1="330" y1="90" x2="344" y2="90" stroke="#FFA500" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="345" y="60" width="96" height="60" rx="8" fill="#173F73" stroke="#00FF00"/>
<text x="393.0" y="86" fill="#FFFFFF" font-size="13" text-anchor="middle">Evaluate</text>
<text x="393.0" y="104" fill="#FFFFFF" font-size="13" text-anchor="middle">(R², RMSE)</text>
<line x1="441" y1="90" x2="455" y2="90" stroke="#FFA500" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="456" y="60" width="96" height="60" rx="8" fill="#173F73" stroke="#00FF00"/>
<text x="504.0" y="95" fill="#FFFFFF" font-size="13" text-anchor="middle">Predict</text>
<text x="280" y="35" fill="#FFA500" font-size="16" text-anchor="middle">A typical regression workflow</text>
</svg>
